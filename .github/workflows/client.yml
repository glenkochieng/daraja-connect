name: Client

on:
  pull_request:
    paths:
      - 'client/**'
      - 'package.json'
      - 'package-lock.json'
      - 'eslint.config.js'
      - '.github/workflows/client.yml'
  push:
    branches: [main]
    paths: ['client/**', 'package-lock.json', '.github/workflows/client.yml']

permissions:
  contents: read

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, test and build (React client)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: ESLint
        run: npx eslint client
      - name: Tests
        run: npm test --workspace client
      - name: Production build
        run: npm run build --workspace client
