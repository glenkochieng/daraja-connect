name: End-to-end

on:
  pull_request:
    paths:
      - 'client/**'
      - 'server/**'
      - 'ml-service/src/**'
      - 'ml-service/data/**'
      - 'ml-service/config/**'
      - 'ml-service/requirements.txt'
      - 'e2e/**'
      - 'playwright.config.js'
      - 'package-lock.json'
      - '.github/workflows/e2e.yml'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright (whole stack, Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: ml-service/requirements.txt
      - name: Install the matching service
        run: |
          python -m pip install --upgrade pip
          pip install -r ml-service/requirements.txt
          pip install -e ml-service --no-deps
      - name: Install JavaScript dependencies
        run: npm ci
      # mongodb-memory-server downloads a MongoDB binary on first use; keep it between runs.
      - name: Cache MongoDB binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: mongodb-binaries-${{ runner.os }}-
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run the end-to-end tests
        run: npx playwright test
      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
