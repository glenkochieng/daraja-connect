name: Feature or task
description: A new feature, an improvement, or a piece of planned work
labels: ["feature"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      multiple: true
      options:
        - client (React)
        - server (Express API)
        - ml-service (Python recommender)
        - e2e / CI / repository
        - Documentation
        - Research / evaluation
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or goal
      description: Who needs this, and why?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will we know it is done? One checkbox per testable outcome.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Links, related issues, out-of-scope items.
