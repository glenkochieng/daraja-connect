name: Bug report
description: Something in Daraja Connect is broken or behaves unexpectedly
title: 'bug: '
labels: ['bug']
body:
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - client (React)
        - server (Express API)
        - ml-service (Python recommender)
        - e2e / CI / repository
        - Not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the exact error message if there is one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in as a mentee
        2. Open Mentorship
        3. ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, and which branch or commit you were on.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove any passwords, tokens or personal data first.
      render: shell
